<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EcoSphere ESG Management Platform</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">E</span>
          <div>
            <strong>EcoSphere</strong>
            <span>ESG Platform</span>
          </div>
        </div>

        <nav class="nav-list" id="nav-list">
          <button type="button" data-route="dashboard">Dashboard</button>
          <button type="button" data-route="settings">Settings</button>
          <button type="button" data-route="environmental">Environmental</button>
          <button type="button" data-route="social">Social</button>
          <button type="button" data-route="gamification">Gamification</button>
          <button type="button" data-route="governance">Governance</button>
          <button type="button" data-route="reports">Reports</button>
        </nav>

        <button class="secondary full-width" type="button" data-action="reset-demo">Reset Demo Data</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Hackathon MVP</p>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <span class="pill" id="notification-count">0 notifications</span>
            <span class="pill strong">Aditi Rao: <span id="points-balance">0</span> pts</span>
          </div>
        </header>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <section id="app" class="content" tabindex="-1"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
